[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bnn-inversion"
version = "0.1.0"
description = "Small-sample well-log inversion with calibrated uncertainty"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
bnn-inversion = "bnn_inversion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

