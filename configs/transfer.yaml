seed: 42
method: M5
data:
  root: dataset
  dataset: spwla
  feature_profile: transfer_5
  split_mode: group_well
  test_fraction: 0.2
  validation_size: 200
  initial_labels: 500
  window_size: 11
model:
  point_architecture: target_aware_bilstm
  hidden_size: 80
  layers: 3
  deterministic_dropout: 0.08
  mc_dropout: 0.1
  target_head_hidden_sizes: [128, 96, 96]
  target_dropouts: [0.05, 0.05, 0.08]
  bounded_targets: [PHIF, SW, VSH]
training:
  learning_rate: 0.0008
  point_loss: huber
  target_loss_scaling: true
  target_loss_weights: [3.0, 1.8, 0.9]
  relative_loss_weight: 0.03
  relative_loss_epsilon: 0.05
  weight_decay: 0.0001
  lr_patience: 4
  lr_factor: 0.5
runtime:
  output_dir: outputs/spwla_transfer
