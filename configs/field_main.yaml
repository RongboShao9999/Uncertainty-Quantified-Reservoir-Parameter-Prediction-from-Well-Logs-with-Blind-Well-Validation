seed: 42
method: M5
data:
  root: D:/coding/BNN/DATASET
  dataset: field
  feature_profile: main_7
  split_mode: group_well
  test_fraction: 0.2
  validation_size: 200
  initial_labels: 500
  window_size: 15
model:
  point_architecture: target_aware_bilstm
  hidden_size: 96
  layers: 3
  deterministic_dropout: 0.10
  mc_dropout: 0.1
  target_head_hidden_sizes: [96, 96, 128]
  target_dropouts: [0.06, 0.06, 0.12]
  bounded_targets: [PHIF, SW]
training:
  learning_rate: 0.0007
  point_loss: huber
  target_loss_scaling: true
  target_loss_weights: [2.0, 2.8, 0.9]
  relative_loss_weight: 0.03
  relative_loss_epsilon: 0.05
  weight_decay: 0.0001
  lr_patience: 4
  lr_factor: 0.5

